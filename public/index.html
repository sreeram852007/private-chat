<!DOCTYPE html>
<html>
<head>
<title>Ghost 💀 Chat</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0f14;
    color: white;
}

/* LOGIN */
#login {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #0b0f14, black);
}

#login-box {
    text-align: center;
}

#usernameInput {
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #1f2937;
    color: white;
}

/* CHAT */
#chat {
    display: none;
    height: 100vh;
    flex-direction: column;
}

#header {
    background: #111827;
    padding: 15px;
    color: #00ffcc;
    font-size: 18px;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

/* MESSAGE */
.msg {
    max-width: 70%;
    padding: 10px;
    margin: 6px;
    border-radius: 12px;
    clear: both;
    word-wrap: break-word;
}

.me {
    float: right;
    background: linear-gradient(135deg, #00ffcc, #00b3ff);
    color: black;
}

.other {
    float: left;
    background: #1f2937;
}

.user {
    font-size: 11px;
    opacity: 0.7;
    display: block;
    margin-bottom: 4px;
}

/* INPUT AREA */
#form {
    display: flex;
    padding: 10px;
    background: #111827;
    gap: 5px;
}

#input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: none;
    background: #1f2937;
    color: white;
    outline: none;
}

button {
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #00ffcc;
    cursor: pointer;
}

/* FLOAT BUTTON */
#scrollBtn {
    position: fixed;
    bottom: 90px;
    right: 15px;
    padding: 12px;
    border-radius: 50%;
    border: none;
    background: #00ffcc;
    color: black;
    display: none;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <div id="login-box">
        <h2>👻 Ghost 💀 Chat</h2>
        <input id="usernameInput" placeholder="Enter Ghost Name">
        <br><br>
        <button onclick="startChat()">Enter</button>
    </div>
</div>

<!-- CHAT -->
<div id="chat">
    <div id="header">👻 Ghost 💀 Chat</div>

    <div id="messages"></div>

    <div id="form">
        <input id="input" placeholder="Message...">
        <input type="file" id="file">

        <button onclick="sendVoice()">🎤</button>
        <button onclick="sendMessage()">➤</button>
    </div>

    <button id="scrollBtn" onclick="scrollToBottom()">⬇</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let username = "";

const messagesDiv = document.getElementById("messages");
const scrollBtn = document.getElementById("scrollBtn");

// ---------------- LOGIN ----------------
function startChat() {
    username = document.getElementById("usernameInput").value;
    if (!username) return;

    socket.emit("set username", username);

    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";
}

// ---------------- SCROLL ----------------
function scrollToBottom() {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

messagesDiv.addEventListener("scroll", () => {
    const nearBottom =
        messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 120;

    scrollBtn.style.display = nearBottom ? "none" : "block";
});

// ---------------- BASE64 ----------------
function toBase64(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(",")[1]);
        reader.readAsDataURL(file);
    });
}

// ---------------- SEND MESSAGE ----------------
async function sendMessage() {
    const text = document.getElementById("input").value;
    const file = document.getElementById("file").files[0];

    let fileBase64 = "";

    if (file) {
        fileBase64 = await toBase64(file);
    }

    socket.emit("chat message", {
        text,
        type: file ? "file" : "text",
        file: fileBase64
    });

    document.getElementById("input").value = "";
    document.getElementById("file").value = "";
}

// ---------------- VOICE ----------------
async function sendVoice() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const recorder = new MediaRecorder(stream);

    let chunks = [];

    recorder.ondataavailable = e => chunks.push(e.data);

    recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: "audio/webm" });

        const reader = new FileReader();

        reader.onloadend = () => {
            const base64 = reader.result.split(",")[1];

            socket.emit("chat message", {
                type: "voice",
                voice: base64
            });
        };

        reader.readAsDataURL(blob);
    };

    recorder.start();
    setTimeout(() => recorder.stop(), 4000);
}

// ---------------- RECEIVE MESSAGE ----------------
socket.on("chat message", (msg) => {

    const div = document.createElement("div");

    const isMe = msg.user === username;

    div.className = "msg " + (isMe ? "me" : "other");

    let html = `<span class="user">${msg.user}</span>`;

    if (msg.type === "text") {
        html += msg.text;
    }

    if (msg.type === "file") {
        html += `<a href="data:application/octet-stream;base64,${msg.file}" download>📎 Download File</a>`;
    }

    if (msg.type === "voice") {
        html += `<audio controls src="data:audio/webm;base64,${msg.voice}"></audio>`;
    }

    div.innerHTML = html;

    messagesDiv.appendChild(div);

    scrollToBottom();
});

// ---------------- HISTORY ----------------
socket.on("chat history", (msgs) => {

    msgs.forEach(msg => {

        const div = document.createElement("div");

        const isMe = msg.user === username;

        div.className = "msg " + (isMe ? "me" : "other");

        let html = `<span class="user">${msg.user}</span>`;

        if (msg.type === "text") html += msg.text;

        if (msg.type === "file") {
            html += `<a href="data:application/octet-stream;base64,${msg.file}" download>📎 Download File</a>`;
        }

        if (msg.type === "voice") {
            html += `<audio controls src="data:audio/webm;base64,${msg.voice}"></audio>`;
        }

        div.innerHTML = html;
        messagesDiv.appendChild(div);
    });

    scrollToBottom();
});
</script>

</body>
</html>
