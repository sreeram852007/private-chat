<!DOCTYPE html>
<html>
<head>
    <title>Ghost Chat</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0d0f14;
            color: white;
        }

        /* LOGIN */
        #login {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #111827, #05070c);
        }

        #login-box {
            background: #121826;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,255,200,0.2);
        }

        #login input {
            width: 220px;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #1f2937;
            color: white;
            outline: none;
        }

        #login button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #00ffcc;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        /* HEADER */
        #header {
            padding: 15px;
            background: #0b1220;
            border-bottom: 1px solid #1f2937;
            font-size: 18px;
            color: #00ffcc;
            letter-spacing: 1px;
        }

        /* CHAT AREA */
        #chat {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        /* MESSAGE BOX */
        .msg {
            max-width: 70%;
            margin: 8px 0;
            padding: 10px 12px;
            border-radius: 10px;
            word-wrap: break-word;
            clear: both;
            font-size: 14px;
        }

        .me {
            float: right;
            background: linear-gradient(135deg, #00ffcc, #00b3ff);
            color: black;
        }

        .other {
            float: left;
            background: #1f2937;
            border: 1px solid #374151;
        }

        .user {
            font-size: 11px;
            opacity: 0.7;
            display: block;
            margin-bottom: 4px;
        }

        /* INPUT */
        #form {
            display: flex;
            padding: 10px;
            background: #0b1220;
            border-top: 1px solid #1f2937;
        }

        #form input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: none;
            background: #111827;
            color: white;
            outline: none;
        }

        #form button {
            margin-left: 10px;
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            background: #00ffcc;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
    <div id="login-box">
        <h2>👻 Ghost Chat</h2>
        <input id="usernameInput" placeholder="Enter Ghost Name">
        <button onclick="startChat()">Enter</button>
    </div>
</div>

<!-- CHAT -->
<div id="chat">
    <div id="header">👻 Ghost Chat</div>

    <div id="messages"></div>

    <form id="form">
        <input id="input" placeholder="Type message..." autocomplete="off">
        <button>Send</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let username = "";

function startChat() {
    username = document.getElementById("usernameInput").value;
    if (!username) return;

    socket.emit("set username", username);

    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";
}

const form = document.getElementById("form");
const input = document.getElementById("input");
const messages = document.getElementById("messages");

form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (input.value) {
        socket.emit("chat message", input.value);
        input.value = "";
    }
});

function addMessage(msg) {
    const div = document.createElement("div");

    const isMe = msg.user === username;

    div.classList.add("msg");
    div.classList.add(isMe ? "me" : "other");

    div.innerHTML = `<span class="user">${msg.user}</span>${msg.text}`;

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

socket.on("chat message", addMessage);
socket.on("chat history", (msgs) => msgs.forEach(addMessage));
</script>

</body>
</html>
