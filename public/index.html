<!DOCTYPE html>
<html>
<head>
<title>Ghost 💀 Chat</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0f14;
    color: white;
}

/* HEADER */
#header {
    background: #111827;
    padding: 15px;
    color: #00ffcc;
    font-size: 18px;
}

/* CHAT */
#chat {
    display: none;
    height: 100vh;
    flex-direction: column;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

/* MSG */
.msg {
    max-width: 70%;
    padding: 10px;
    margin: 6px;
    border-radius: 10px;
    clear: both;
}

.me { float: right; background: #00ffcc; color: black; }
.other { float: left; background: #1f2937; }

.user {
    font-size: 11px;
    opacity: 0.7;
    display: block;
}

/* INPUT */
#form {
    display: flex;
    padding: 10px;
    background: #111827;
}

#input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 20px;
    background: #1f2937;
    color: white;
}

/* BUTTONS */
button {
    margin-left: 5px;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #00ffcc;
}

/* LOGIN */
#login {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: black;
}
</style>
</head>

<body>

<div id="login">
    <div>
        <h2>👻 Ghost 💀 Chat</h2>
        <input id="usernameInput" placeholder="Enter Ghost Name">
        <button onclick="startChat()">Enter</button>
    </div>
</div>

<div id="chat">
    <div id="header">👻 Ghost 💀 Chat</div>

    <div id="messages"></div>

    <div id="form">
        <input id="input" placeholder="Message...">

        <input type="file" id="file">

        <button onclick="sendVoice()">🎤</button>
        <button onclick="send()">➤</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let username = "";

// LOGIN
function startChat() {
    username = document.getElementById("usernameInput").value;
    socket.emit("set username", username);

    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";
}

// SEND TEXT / FILE
async function send() {
    const text = document.getElementById("input").value;
    const file = document.getElementById("file").files[0];

    let fileUrl = "";

    if (file) {
        const formData = new FormData();
        formData.append("file", file);

        const res = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        const data = await res.json();
        fileUrl = data.fileUrl;
    }

    socket.emit("chat message", {
        text,
        file: fileUrl,
        type: file ? "file" : "text"
    });

    document.getElementById("input").value = "";
}

// VOICE MESSAGE
let recorder;
let chunks = [];

async function sendVoice() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);

    recorder.start();

    recorder.ondataavailable = e => {
        chunks.push(e.data);
    };

    recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: "audio/webm" });
        chunks = [];

        const formData = new FormData();
        formData.append("file", blob, "voice.webm");

        const res = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        socket.emit("chat message", {
            voice: data.fileUrl,
            type: "voice"
        });
    };

    setTimeout(() => recorder.stop(), 4000);
}

// RECEIVE
socket.on("chat message", (msg) => {
    const div = document.createElement("div");

    const isMe = msg.user === username;

    div.className = "msg " + (isMe ? "me" : "other");

    let content = `<span class="user">${msg.user}</span>`;

    if (msg.type === "text") content += msg.text;

    if (msg.type === "file") {
        content += `<br><a href="${msg.file}" target="_blank">📎 File</a>`;
    }

    if (msg.type === "voice") {
        content += `<audio controls src="${msg.voice}"></audio>`;
    }

    div.innerHTML = content;

    document.getElementById("messages").appendChild(div);
});

// HISTORY
socket.on("chat history", msgs => {
    msgs.forEach(m => socket.emit("chat message", m));
});
</script>

</body>
</html>
