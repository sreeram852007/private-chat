<!DOCTYPE html>
<html>
<head>
<title>Ghost 💀 Chat Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
/* ================= GLOBAL FIX ================= */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    font-family: Arial;
    background: #0b0f14;
    color: white;

    position: fixed;
    top: 0;
    left: 0;
}

/* ================= LOGIN ================= */
#login {
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #0b0f14, black);
}

#login-box {
    text-align: center;
    width: 90%;
    max-width: 320px;
}

#usernameInput {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #1f2937;
    color: white;
    outline: none;
}

/* ================= CHAT ================= */
#chat {
    display: none;
    height: 100dvh;
    width: 100%;
    flex-direction: column;
}

/* HEADER */
#header {
    flex-shrink: 0;
    background: #111827;
    padding: 12px;
    color: #00ffcc;
    font-size: 15px;
    text-align: center;
}

/* MESSAGES */
#messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    padding: 10px;

    padding-bottom: 90px;

    -webkit-overflow-scrolling: touch;
}

/* MESSAGE */
.msg {
    max-width: 85%;
    padding: 10px;
    margin: 5px;
    border-radius: 12px;
    word-wrap: break-word;
    font-size: 14px;
}

.me {
    align-self: flex-end;
    background: linear-gradient(135deg, #00ffcc, #00b3ff);
    color: black;
}

.other {
    align-self: flex-start;
    background: #1f2937;
}

.user {
    font-size: 11px;
    opacity: 0.7;
    display: block;
    margin-bottom: 3px;
}

/* ================= INPUT BAR ================= */
#form {
    display: flex;
    gap: 5px;
    padding: 8px;
    background: #111827;

    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;

    z-index: 999;

    padding-bottom: calc(8px + env(safe-area-inset-bottom));
}

#input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: none;
    background: #1f2937;
    color: white;
    outline: none;
}

button {
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #00ffcc;
    cursor: pointer;
}

/* ================= MOBILE ================= */
@media (max-width: 600px) {
    #header { font-size: 13px; }

    .msg {
        max-width: 92%;
        font-size: 13px;
    }

    button {
        padding: 8px;
        font-size: 12px;
    }

    #input {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="login">
    <div id="login-box">
        <h2>👻 Ghost 💀 Chat Pro</h2>

        <input id="usernameInput" placeholder="Enter Ghost Name">
        <br><br>

        <button onclick="login()">Login</button>
        <button onclick="register()">Register</button>
    </div>
</div>

<!-- ================= CHAT ================= -->
<div id="chat">
    <div id="header">👻 Ghost 💀 Chat Pro</div>

    <div id="messages"></div>

    <div id="form">
        <input id="input" placeholder="Message...">
        <input type="file" id="file">

        <button onclick="sendVoice()">🎤</button>
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let username = "";

const messagesDiv = document.getElementById("messages");

/* ================= LOGIN / REGISTER ================= */

async function register() {
    const usernameInput = document.getElementById("usernameInput").value;
    const password = prompt("Create password");

    const res = await fetch("/register", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ username: usernameInput, password })
    });

    const data = await res.json();
    alert(data.error || "Registered!");
}

async function login() {
    const usernameInput = document.getElementById("usernameInput").value;
    const password = prompt("Enter password");

    const res = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ username: usernameInput, password })
    });

    const data = await res.json();

    if (data.user) {
        username = data.user.username;
        socket.emit("set user", data.user);
        startChat();
    } else {
        alert(data.error);
    }
}

function startChat() {
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";
}

/* ================= ENTER KEY ================= */

document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
});

document.getElementById("usernameInput").addEventListener("keydown", e => {
    if (e.key === "Enter") login();
});

/* ================= BASE64 ================= */

function toBase64(file) {
    return new Promise(resolve => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(",")[1]);
        reader.readAsDataURL(file);
    });
}

/* ================= SEND ================= */

async function sendMessage() {
    const text = document.getElementById("input").value;
    const file = document.getElementById("file").files[0];

    let fileBase64 = "";
    if (file) fileBase64 = await toBase64(file);

    socket.emit("chat message", {
        text,
        type: file ? "file" : "text",
        file: fileBase64
    });

    document.getElementById("input").value = "";
    document.getElementById("file").value = "";
}

/* ================= VOICE ================= */

async function sendVoice() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const recorder = new MediaRecorder(stream);

    let chunks = [];

    recorder.ondataavailable = e => chunks.push(e.data);

    recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: "audio/webm" });

        const reader = new FileReader();
        reader.onloadend = () => {
            socket.emit("chat message", {
                type: "voice",
                voice: reader.result.split(",")[1]
            });
        };

        reader.readAsDataURL(blob);
    };

    recorder.start();
    setTimeout(() => recorder.stop(), 4000);
}

/* ================= RECEIVE ================= */

socket.on("chat message", (msg) => {

    const div = document.createElement("div");
    const isMe = msg.user === username;

    div.className = "msg " + (isMe ? "me" : "other");

    let html = `<span class="user">${msg.user}</span>`;

    if (msg.type === "text") html += msg.text;

    if (msg.type === "file") {
        html += `<a href="data:application/octet-stream;base64,${msg.file}" download>📎 File</a>`;
    }

    if (msg.type === "voice") {
        html += `<audio controls src="data:audio/webm;base64,${msg.voice}"></audio>`;
    }

    div.innerHTML = html;
    messagesDiv.appendChild(div);

    messagesDiv.scrollTop = messagesDiv.scrollHeight;
});
</script>

</body>
</html>
