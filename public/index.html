<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commit Chat | Dev Communication</title>
<style>
/* ================= PROGRAMMER THEME ================= */
:root {
    --bg-primary: #0a0e1a;
    --bg-secondary: #0f1420;
    --bg-tertiary: #151b28;
    --text-primary: #e4e7f0;
    --text-secondary: #8b93b0;
    --accent-primary: #3b82f6;
    --accent-secondary: #10b981;
    --accent-danger: #ef4444;
    --border-color: #1f2937;
    --code-bg: #1a1f2e;
    --terminal-green: #10b981;
    --terminal-gray: #6b7280;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
}

html, body {
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg-primary);
    color: var(--text-primary);
}

/* ================= LOGIN SCREEN ================= */

#login {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0a0e1a 0%, #0f1420 100%);
}

#login-box {
    width: 90%;
    max-width: 400px;
    text-align: center;
    background: var(--bg-secondary);
    border-radius: 16px;
    padding: 40px;
    border: 1px solid var(--border-color);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

#login-box h2 {
    margin-bottom: 30px;
    font-size: 28px;
    font-weight: 700;
}

.accent {
    color: var(--accent-primary);
}

.terminal-prefix {
    color: var(--terminal-green);
    font-size: 14px;
    margin-right: 8px;
}

#usernameInput {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-size: 14px;
    margin-bottom: 20px;
    font-family: monospace;
}

#usernameInput:focus {
    outline: none;
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
}

.login-btn {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    margin: 5px;
    transition: all 0.2s;
    font-family: monospace;
}

.login-btn:first-of-type {
    background: var(--accent-primary);
    color: white;
}

.login-btn:last-of-type {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
}

.login-btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.1);
}

/* ================= MAIN CHAT ================= */

#chat {
    display: none;
    width: 100%;
    height: 100dvh;
    flex-direction: row;
}

/* SIDEBAR - Programmer Style */

#sidebar {
    width: 300px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border-color);
    overflow-y: auto;
    transition: 0.3s;
}

#sidebar-header {
    padding: 20px;
    font-weight: 700;
    font-size: 18px;
    border-bottom: 1px solid var(--border-color);
    background: var(--bg-tertiary);
}

#sidebar-header .repo-badge {
    font-size: 11px;
    color: var(--terminal-green);
    margin-top: 5px;
    font-family: monospace;
}

.user-item {
    padding: 14px 20px;
    cursor: pointer;
    border-bottom: 1px solid var(--border-color);
    transition: all 0.2s;
}

.user-item:hover {
    background: var(--bg-tertiary);
    transform: translateX(4px);
}

.user-name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
}

.user-status {
    font-size: 11px;
    font-family: monospace;
}

.user-online {
    color: var(--terminal-green);
}

.user-offline {
    color: var(--terminal-gray);
}

.user-online::before {
    content: "●";
    margin-right: 5px;
}

.user-offline::before {
    content: "○";
    margin-right: 5px;
}

/* CHAT AREA */

#chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg-primary);
}

#header {
    background: var(--bg-secondary);
    padding: 15px 20px;
    border-bottom: 1px solid var(--border-color);
}

#menuBtn {
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 12px;
    font-family: monospace;
    font-size: 12px;
}

#chatTitle {
    font-weight: 600;
    font-size: 14px;
    color: var(--accent-primary);
}

#chatTitle::before {
    content: "$";
    color: var(--terminal-green);
    margin-right: 8px;
}

/* MESSAGES */

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    padding-bottom: 90px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    word-wrap: break-word;
    font-size: 13px;
    line-height: 1.5;
}

.me {
    align-self: flex-end;
    background: linear-gradient(135deg, #1e3a5f, #1a2d4a);
    border: 1px solid var(--accent-primary);
    color: var(--text-primary);
}

.other {
    align-self: flex-start;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
}

.user {
    display: block;
    font-size: 10px;
    opacity: 0.7;
    margin-bottom: 5px;
    font-family: monospace;
}

.message-time {
    font-size: 9px;
    opacity: 0.5;
    margin-top: 4px;
    text-align: right;
    font-family: monospace;
}

/* INPUT FORM */

#form {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-color);
    position: fixed;
    bottom: 0;
    left: 300px;
    right: 0;
    z-index: 1000;
}

#input {
    flex: 1;
    padding: 10px 16px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-family: monospace;
    font-size: 13px;
}

#input:focus {
    outline: none;
    border-color: var(--accent-primary);
}

#form button, #fileBtn {
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
}

#form button:hover, #fileBtn:hover {
    background: var(--accent-primary);
    border-color: var(--accent-primary);
}

/* FILE DOWNLOAD */

a[download] {
    color: var(--accent-primary);
    text-decoration: none;
    font-size: 12px;
    font-family: monospace;
}

a[download]:hover {
    text-decoration: underline;
}

/* AUDIO PLAYER */

audio {
    max-width: 200px;
    height: 30px;
    margin-top: 5px;
}

/* SCROLLBAR */

::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track {
    background: var(--bg-secondary);
}

::-webkit-scrollbar-thumb {
    background: var(--accent-primary);
    border-radius: 3px;
}

/* MOBILE RESPONSIVE */

@media (max-width: 768px) {
    #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        z-index: 9999;
        transform: translateX(-100%);
    }
    
    #sidebar.open {
        transform: translateX(0);
    }
    
    #form {
        left: 0;
    }
    
    .msg {
        max-width: 85%;
    }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
    <div id="login-box">
        <h2>
            <span class="terminal-prefix">$></span>
            <span class="accent">Commit</span> Chat
        </h2>
        <p style="font-size: 11px; color: #6b7280; margin-bottom: 20px;">
            git commit -m "secure communication"
        </p>
        <input id="usernameInput" placeholder="username@commit.chat">
        <br>
        <button class="login-btn" onclick="login()">git login</button>
        <button class="login-btn" onclick="register()">git register</button>
    </div>
</div>

<!-- CHAT -->
<div id="chat">
    <div id="sidebar">
        <div id="sidebar-header">
            🗂️ /dev/users
            <div class="repo-badge">● online contributors</div>
        </div>
        <div id="usersList"></div>
    </div>

    <div id="chat-area">
        <div id="header">
            <button id="menuBtn" onclick="toggleUsers()">☰ ls users</button>
            <span id="chatTitle">~/select/peer</span>
        </div>
        <div id="messages"></div>
        <div id="form">
            <input id="input" placeholder="type your message...">
            <input type="file" id="file" hidden>
            <label for="file" id="fileBtn">📎</label>
            <button onclick="sendVoice()">🎤</button>
            <button onclick="sendMessage()">⏎</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let username = "";
let token = "";
let selectedUser = "";
let onlineUsers = [];

const messagesDiv = document.getElementById("messages");
const usersList = document.getElementById("usersList");

function toggleUsers() {
    document.getElementById("sidebar").classList.toggle("open");
}

function startChat() {
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";
    loadUsers();
}

async function register() {
    const usernameInput = document.getElementById("usernameInput").value.trim();
    if (!usernameInput) {
        alert("Enter username");
        return;
    }
    const password = prompt("Create password:");
    if (!password) return;
    
    const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: usernameInput, password })
    });
    const data = await res.json();
    if (data.error) {
        alert(data.error);
        return;
    }
    alert("✅ Registered successfully");
}

let loginInProgress = false;

async function login() {
    if (loginInProgress) return;
    loginInProgress = true;
    
    try {
        const usernameInput = document.getElementById("usernameInput").value.trim();
        if (!usernameInput) {
            alert("Enter username");
            loginInProgress = false;
            return;
        }
        const password = prompt("Enter password:");
        if (!password) {
            loginInProgress = false;
            return;
        }
        
        const res = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: usernameInput, password })
        });
        const data = await res.json();
        
        if (!data.user) {
            alert(data.error || "Login failed");
            loginInProgress = false;
            return;
        }
        
        username = data.user.username;
        token = data.token;
        socket.emit("set user", token);
        startChat();
    } catch (err) {
        console.error(err);
        alert("Login failed");
    } finally {
        loginInProgress = false;
    }
}

async function loadUsers() {
    const res = await fetch("/users");
    const users = await res.json();
    usersList.innerHTML = "";
    
    users.forEach(user => {
        if (user.username === username) return;
        const div = document.createElement("div");
        div.className = "user-item";
        const online = onlineUsers.includes(user.username);
        div.innerHTML = `
            <div class="user-name">${user.username}</div>
            <div class="user-status ${online ? 'user-online' : 'user-offline'}">
                ${online ? 'online' : 'offline'}
            </div>
        `;
        div.onclick = () => openChat(user.username);
        usersList.appendChild(div);
    });
}

async function openChat(user) {
    selectedUser = user;
    if (window.innerWidth < 768) {
        document.getElementById("sidebar").classList.remove("open");
    }
    document.getElementById("chatTitle").innerText = `~/chat/with/${user}`;
    messagesDiv.innerHTML = "";
    
    const res = await fetch(`/messages/${username}/${user}`);
    const messages = await res.json();
    messages.forEach(msg => renderMessage(msg));
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

socket.on("online users", users => {
    onlineUsers = users;
    loadUsers();
});

document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
});
document.getElementById("usernameInput").addEventListener("keydown", e => {
    if (e.key === "Enter") login();
});

function toBase64(file) {
    return new Promise(resolve => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(",")[1]);
        reader.readAsDataURL(file);
    });
}

async function sendMessage() {
    if (!selectedUser) {
        alert("Select a user first");
        return;
    }
    const text = document.getElementById("input").value.trim();
    const file = document.getElementById("file").files[0];
    let fileBase64 = "";
    if (file) fileBase64 = await toBase64(file);
    if (!text && !fileBase64) return;
    
    socket.emit("private message", {
        receiver: selectedUser,
        text,
        type: file ? "file" : "text",
        file: fileBase64
    });
    document.getElementById("input").value = "";
    document.getElementById("file").value = "";
}

async function sendVoice() {
    if (!selectedUser) {
        alert("Select a user first");
        return;
    }
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const recorder = new MediaRecorder(stream);
    let chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
        const blob = new Blob(chunks, { type: "audio/webm" });
        const reader = new FileReader();
        reader.onloadend = () => {
            socket.emit("private message", {
                receiver: selectedUser,
                type: "voice",
                voice: reader.result.split(",")[1]
            });
        };
        reader.readAsDataURL(blob);
    };
    recorder.start();
    setTimeout(() => recorder.stop(), 4000);
}

function formatTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function renderMessage(msg) {
    const div = document.createElement("div");
    const isMe = msg.sender === username;
    div.className = "msg " + (isMe ? "me" : "other");
    let html = `<span class="user">${msg.sender}</span>`;
    
    if (msg.type === "text") {
        html += msg.text || "";
    }
    if (msg.type === "file") {
        html += `<a href="data:application/octet-stream;base64,${msg.file}" download>📎 download file</a>`;
    }
    if (msg.type === "voice") {
        html += `<audio controls src="data:audio/webm;base64,${msg.voice}"></audio>`;
    }
    
    html += `<div class="message-time">${formatTime()}</div>`;
    div.innerHTML = html;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

socket.on("private message", msg => {
    const currentChat = (msg.sender === selectedUser && msg.receiver === username) ||
                       (msg.sender === username && msg.receiver === selectedUser);
    if (currentChat) renderMessage(msg);
});
</script>
</body>
</html>
