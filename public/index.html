<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ghost 💀 Chat Pro</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:#0b0f14;
    color:white;
}

/* ================= LOGIN ================= */

#login{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#111827,#000);
}

#login-box{
    width:90%;
    max-width:350px;
    text-align:center;
}

#login-box h2{
    margin-bottom:20px;
    color:#00ffcc;
}

#usernameInput{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
    margin-bottom:15px;
}

.login-btn{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#00ffcc;
    margin:5px;
}

/* ================= CHAT ================= */

#chat{
    display:none;
    width:100%;
    height:100dvh;
    flex-direction:row;
}

/* LEFT USERS PANEL */

#menuBtn{
    margin-right:10px;
}

#sidebar{
    width:280px;
    background:#111827;
    border-right:1px solid #222;
    overflow-y:auto;
    transition:.3s;
}

#sidebar-header{
    padding:15px;
    font-weight:bold;
    color:#00ffcc;
    border-bottom:1px solid #222;
}

.user-item{
    padding:12px;
    cursor:pointer;
    border-bottom:1px solid #1f2937;
}

.user-item:hover{
    background:#1f2937;
}

.user-online{
    color:#00ff66;
    font-size:12px;
}

.user-offline{
    color:#888;
    font-size:12px;
}

/* RIGHT CHAT AREA */

#chat-area{
    flex:1;
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
}

#header{
    background:#111827;
    padding:15px;
    color:#00ffcc;
    border-bottom:1px solid #222;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
    padding-bottom:90px;
    display:flex;
    flex-direction:column;
}

.msg{
    max-width:75%;
    padding:10px;
    border-radius:12px;
    margin:5px 0;
    word-wrap:break-word;
}

.me{
    align-self:flex-end;
    background:linear-gradient(
        135deg,
        #00ffcc,
        #00b3ff
    );
    color:black;
}

.other{
    align-self:flex-start;
    background:#1f2937;
}

.user{
    display:block;
    font-size:11px;
    opacity:.7;
    margin-bottom:3px;
}

#form{
    display:flex;
    align-items:center;
    gap:5px;

    padding:10px;
    background:#111827;

    position:fixed;
    bottom:0;
    left:280px;
    right:0;

    z-index:1000;
}

#input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:20px;
    background:#1f2937;
    color:white;
}

button{
    border:none;
    border-radius:10px;
    padding:10px;
    cursor:pointer;
    background:#00ffcc;
}

@media(max-width:768px){

    #sidebar{
        position:fixed;
        left:0;
        top:0;
        bottom:0;
        width:280px;
        z-index:9999;
    }

    #sidebar.closed{
        transform:translateX(-100%);
    }

    #chat-area{
        width:100%;
    }

    .user-item{
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .msg{
        max-width:90%;
    }

    #form{
        position:fixed;
        bottom:0;
        left:0;
        right:0;
        width:100%;

        display:flex;
        align-items:center;
        gap:5px;

        padding:10px;

        background:#111827;

        z-index:99999;

        padding-bottom:calc(
            10px + env(safe-area-inset-bottom)
        );
    }

    #input{
        flex:1;
        min-width:0;
    }
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="login">

    <div id="login-box">

        <h2>👻 Ghost 💀 Chat Pro</h2>

        <input
            id="usernameInput"
            placeholder="Username">

        <br>

        <button
            class="login-btn"
            onclick="login()">
            Login
        </button>

        <button
            class="login-btn"
            onclick="register()">
            Register
        </button>

    </div>

</div>

<!-- CHAT -->

}

/* ================= LOGIN ================= */

async function login() {

    const usernameInput =
        document.getElementById(
            "usernameInput"
        ).value.trim();
<div id="chat">

    <!-- SIDEBAR -->

    <div id="sidebar" class="closed">

        <div id="sidebar-header">
            Users
        </div>

        <div id="usersList"></div>

    </div>

    <!-- CHAT AREA -->

    <div id="chat-area">

        <div id="header">

            <button id="menuBtn"
                onclick="toggleUsers()">
                ☰ Users
            </button>

            <span id="chatTitle">
                Select a user
            </span>

        </div>

        <div id="messages"></div>

        <div id="form">

            <input
                id="input"
                placeholder="Type message...">

            <input
                type="file"
                id="file"
                hidden>

            <label
                for="file"
                id="fileBtn">
                📎
            </label>

            <button onclick="sendVoice()">
                🎤
            </button>

            <button onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let username = "";
let token = "";
let selectedUser = "";
let onlineUsers = [];

const messagesDiv =
    document.getElementById("messages");

const usersList =
    document.getElementById("usersList");

function toggleUsers(){

    document
        .getElementById("sidebar")
        .classList
        .toggle("closed");
}

function startChat() {

    document
        .getElementById("login")
        .style.display = "none";

    document
        .getElementById("chat")
        .style.display = "flex";

    loadUsers();
}

/* ================= REGISTER ================= */

async function register() {

    const usernameInput =
        document.getElementById(
            "usernameInput"
        ).value.trim();

    if (!usernameInput) {
        alert("Enter username");
        return;
    }

    const password =
        prompt("Create password");

    if (!password) return;

    const res =
        await fetch("/register", {
            method: "POST",
            headers: {
                "Content-Type":
                    "application/json"
            },
            body: JSON.stringify({
                username: usernameInput,
                password
            })
        });

    const data =
        await res.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    alert("Registered successfully");
}

/* ================= LOGIN ================= */

async function login() {

    const usernameInput =
        document.getElementById(
            "usernameInput"
        ).value.trim();

    const password =
        prompt("Enter password");

    if (!password) return;

    const res =
        await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type":
                    "application/json"
            },
            body: JSON.stringify({
                username: usernameInput,
                password
            })
        });

    const data =
        await res.json();

    if (!data.user) {

        alert(
            data.error ||
            "Login failed"
        );

        return;
    }

    username =
        data.user.username;

    token =
        data.token;

    socket.emit(
        "set user",
        token
    );

    startChat();
}

/* ================= USERS ================= */

async function loadUsers() {

    const res =
        await fetch("/users");

    const users =
        await res.json();

    usersList.innerHTML = "";

    users.forEach(user => {

        if (
            user.username ===
            username
        ) return;

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "user-item";

        const online =
            onlineUsers.includes(
                user.username
            );

        div.innerHTML = `
            <div>
                ${user.username}
            </div>

            <div class="${
                online
                ? "user-online"
                : "user-offline"
            }">
                ${
                    online
                    ? "● Online"
                    : "● Offline"
                }
            </div>
        `;

        div.onclick = () =>
            openChat(
                user.username
            );

        usersList.appendChild(
            div
        );
    });
}

/* ================= OPEN CHAT ================= */

async function openChat(user) {

    selectedUser = user;

    if(window.innerWidth < 768){

        document
            .getElementById("sidebar")
            .classList
            .add("closed");
    }

    document
        .getElementById(
            "chatTitle"
        )
        .innerText =
            "Chat with " + user;

    messagesDiv.innerHTML = "";

    const res =
        await fetch(
            `/messages/${username}/${user}`
        );

    const messages =
        await res.json();

    messages.forEach(msg => {
        renderMessage(msg);
    });

    messagesDiv.scrollTop =
        messagesDiv.scrollHeight;
}

/* ================= ONLINE USERS ================= */

socket.on(
    "online users",
    users => {

        onlineUsers = users;

        loadUsers();
    }
);

/* ================= ENTER KEY ================= */

document
.getElementById("input")
.addEventListener(
    "keydown",
    e => {

        if (
            e.key === "Enter"
        ) {
            sendMessage();
        }
    }
);

document
.getElementById(
    "usernameInput"
)
.addEventListener(
    "keydown",
    e => {

        if (
            e.key === "Enter"
        ) {
            login();
        }
    }
);

/* ================= BASE64 ================= */

function toBase64(file) {

    return new Promise(
        resolve => {

            const reader =
                new FileReader();

            reader.onloadend =
                () => {

                    resolve(
                        reader.result
                        .split(",")[1]
                    );
                };

            reader.readAsDataURL(
                file
            );
        }
    );
}

/* ================= SEND MESSAGE ================= */

async function sendMessage() {

    if (!selectedUser) {
        alert("Select a user first");
        return;
    }

    const text =
        document
        .getElementById("input")
        .value
        .trim();

    const file =
        document
        .getElementById("file")
        .files[0];

    let fileBase64 = "";

    if (file) {
        fileBase64 =
            await toBase64(file);
    }

    if (
        !text &&
        !fileBase64
    ) {
        return;
    }

    socket.emit(
        "private message",
        {
            receiver:
                selectedUser,

            text,

            type:
                file
                ? "file"
                : "text",

            file:
                fileBase64
        }
    );

    document
        .getElementById("input")
        .value = "";

    document
        .getElementById("file")
        .value = "";
}

/* ================= VOICE ================= */

async function sendVoice() {

    if (!selectedUser) {
        alert("Select a user first");
        return;
    }

    const stream =
        await navigator
        .mediaDevices
        .getUserMedia({
            audio: true
        });

    const recorder =
        new MediaRecorder(
            stream
        );

    let chunks = [];

    recorder.ondataavailable =
        e => {
            chunks.push(
                e.data
            );
        };

    recorder.onstop =
        () => {

            const blob =
                new Blob(
                    chunks,
                    {
                        type:
                        "audio/webm"
                    }
                );

            const reader =
                new FileReader();

            reader.onloadend =
                () => {

                    socket.emit(
                        "private message",
                        {
                            receiver:
                                selectedUser,

                            type:
                                "voice",

                            voice:
                                reader
                                .result
                                .split(",")[1]
                        }
                    );
                };

            reader.readAsDataURL(
                blob
            );
        };

    recorder.start();

    setTimeout(
        () => recorder.stop(),
        4000
    );
}

/* ================= RENDER ================= */

function renderMessage(msg) {

    const div =
        document.createElement(
            "div"
        );

    const isMe =
        msg.sender ===
        username;

    div.className =
        "msg " +
        (
            isMe
            ? "me"
            : "other"
        );

    let html =
        `<span class="user">${msg.sender}</span>`;

    if (
        msg.type ===
        "text"
    ) {

        html +=
            msg.text || "";
    }

    if (
        msg.type ===
        "file"
    ) {

        html += `
        <a
        href="data:application/octet-stream;base64,${msg.file}"
        download>
        📎 Download File
        </a>
        `;
    }

    if (
        msg.type ===
        "voice"
    ) {

        html += `
        <br>
        <audio
        controls
        src="data:audio/webm;base64,${msg.voice}">
        </audio>
        `;
    }

    div.innerHTML =
        html;

    messagesDiv
        .appendChild(div);

    messagesDiv.scrollTop =
        messagesDiv.scrollHeight;
}

/* ================= RECEIVE ================= */

socket.on(
    "private message",
    msg => {

        const currentChat =
            (
                msg.sender ===
                selectedUser
                &&
                msg.receiver ===
                username
            )
            ||
            (
                msg.sender ===
                username
                &&
                msg.receiver ===
                selectedUser
            );

        if (
            currentChat
        ) {
            renderMessage(
                msg
            );
        }
    }
);

</script>

</body>
</html>
